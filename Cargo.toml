[package]
name = "baileys-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust port of Baileys' WhatsApp Web protocol client"
build = "build.rs"

[dependencies]
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "json"] }
tokio-util = { version = "0.7", features = ["io", "io-util"] }
tracing = "0.1"
base64 = "0.22"
rusqlite = { version = "0.38", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
curve25519-dalek = "4"
ed25519-dalek = "2"
getrandom = "0.3"
hkdf = "0.12"
hmac = "0.12"
md-5 = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
subtle = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }
flate2 = "1"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
symphonia = { version = "0.5.5", features = ["all"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
serde_json = { version = "1", features = ["preserve_order"] }
