[package]
name = "baileys-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust port of Baileys' WhatsApp Web protocol client"
build = "build.rs"

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
curve25519-dalek = "4"
ed25519-dalek = "2"
getrandom = "0.3"
hkdf = "0.12"
hmac = "0.12"
md-5 = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }
flate2 = "1"
indexmap = { version = "2", features = ["serde"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
