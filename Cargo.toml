[package]
name = "baileys-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust port of Baileys' WhatsApp Web protocol client"
build = "build.rs"

[dependencies]
flate2 = "1"
indexmap = { version = "2", features = ["serde"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
