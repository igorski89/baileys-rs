include "default"

queues {
  # RusticMQ's HOCON parser rejects "{ }" with a space inside; keep "{}".
  input-queue {}
  output-queue {}
}

node {
  # Node address for internal communication
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  # Allow larger messages (up to 256MB like AWS SQS)
  sqs-limits = relaxed
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

# Allow request bodies up to 500 MB (base64 media), as mimi's ElasticMQ does;
# RusticMQ honors this from ee7053f on.
pekko {
  http {
    server {
      parsing {
        max-content-length = 500m
      }
    }
  }
}
